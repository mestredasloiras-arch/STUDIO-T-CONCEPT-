<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>STUDIO T CONCEPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a961;
  --gold-light: #e6c88a;
  --gold-dark: #a8894a;
  --black: #0a0a0a;
  --black-soft: #141414;
  --black-card: #1a1a1a;
  --white: #ffffff;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --gray-400: #9a9a9a;
  --gray-600: #6a6a6a;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
  --info: #3498db;
  --bg: var(--black);
  --bg-soft: var(--black-soft);
  --bg-card: var(--black-card);
  --text: var(--white);
  --text-muted: var(--gray-400);
  --border: rgba(201,169,97,0.15);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 40px rgba(0,0,0,0.4);
  --shadow-gold: 0 8px 30px rgba(201,169,97,0.15);
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"] {
  --bg: #fafafa;
  --bg-soft: #ffffff;
  --bg-card: #ffffff;
  --text: #0a0a0a;
  --text-muted: #6a6a6a;
  --border: rgba(201,169,97,0.3);
  --gray-100: #f0f0f0;
  --shadow: 0 10px 40px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none;
  transition: background 0.3s ease, color 0.3s ease;
}
body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 600; letter-spacing: 0.5px; }
button, input, select, textarea { font-family: inherit; font-size: 15px; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--gold); text-decoration: none; }
.hidden { display: none !important; }

#splash {
  position: fixed; inset: 0; background: var(--black);
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  z-index: 9999; transition: opacity 0.6s ease;
}
.splash-logo {
  font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 600;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 4px; text-align: center;
}
.splash-sub { font-size: 11px; letter-spacing: 8px; color: var(--gold); margin-top: 10px; }
.splash-loader {
  width: 60px; height: 2px; background: rgba(201,169,97,0.2); margin-top: 30px;
  position: relative; overflow: hidden; border-radius: 2px;
}
.splash-loader::after {
  content: ''; position: absolute; left: -40%; top: 0; width: 40%; height: 100%;
  background: var(--gold); animation: load 1.2s infinite;
}
@keyframes load { 0%{left:-40%} 100%{left:100%} }

#app { flex: 1; display: none; flex-direction: column; padding-bottom: 70px; }
#app.active { display: flex; }

.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-soft); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
}
.topbar-logo {
  font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 2px;
}
.topbar-logo img { height: 32px; width: auto; object-fit: contain; }
.topbar-actions { display: flex; gap: 12px; align-items: center; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; transition: var(--transition);
  background: var(--bg-card); border: 1px solid var(--border);
}
.icon-btn:hover { background: var(--gold); color: var(--black); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

main { flex: 1; padding: 18px; max-width: 1200px; width: 100%; margin: 0 auto; }
.page { animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.section-title {
  font-family: 'Playfair Display', serif; font-size: 22px;
  margin: 26px 0 14px; display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: ''; width: 4px; height: 22px;
  background: linear-gradient(180deg, var(--gold-light), var(--gold-dark)); border-radius: 2px;
}
.muted { color: var(--text-muted); font-size: 13px; }
.eyebrow { color: var(--gold); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }

.carousel {
  position: relative; border-radius: var(--radius); overflow: hidden;
  height: 200px; box-shadow: var(--shadow);
}
.carousel-slide {
  position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease;
  background-size: cover; background-position: center; display: flex;
  align-items: flex-end; padding: 24px;
}
.carousel-slide.active { opacity: 1; }
.carousel-slide::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.1));
}
.carousel-content { position: relative; z-index: 2; color: white; }
.carousel-content h3 { font-size: 20px; margin-bottom: 4px; }
.carousel-content p { font-size: 13px; opacity: 0.9; }
.carousel-dots {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 3;
}
.carousel-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: var(--transition);
}
.carousel-dots span.active { background: var(--gold); width: 20px; border-radius: 3px; }

.quick-actions {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px;
}
.quick-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 6px; text-align: center;
  transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.quick-btn:hover, .quick-btn:active {
  border-color: var(--gold); transform: translateY(-3px); box-shadow: var(--shadow-gold);
}
.quick-btn svg { width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 1.8; }
.quick-btn span { font-size: 11px; font-weight: 500; color: var(--text); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 22px; border-radius: 50px; font-weight: 600; font-size: 14px;
  transition: var(--transition); letter-spacing: 0.5px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
  color: var(--black); box-shadow: 0 6px 20px rgba(201,169,97,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(201,169,97,0.5); }
.btn-outline { border: 1.5px solid var(--gold); color: var(--gold); background: transparent; }
.btn-outline:hover { background: var(--gold); color: var(--black); }
.btn-ghost { color: var(--text-muted); }
.btn-block { width: 100%; }
.btn-sm { padding: 10px 16px; font-size: 13px; }
.btn-danger { background: var(--danger); color: #fff; }

.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  transition: var(--transition);
}
.card:hover { border-color: var(--gold); }
.card-row { display: flex; gap: 14px; align-items: center; }
.thumb {
  width: 70px; height: 70px; border-radius: 12px; flex-shrink: 0;
  background-size: cover; background-position: center;
  background-color: var(--black-soft); border: 1px solid var(--border);
}
.avatar {
  width: 70px; height: 70px; border-radius: 50%; flex-shrink: 0;
  background-size: cover; background-position: center;
  background-color: var(--black-soft); border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: var(--gold);
}

.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 13px 15px; background: var(--bg-soft);
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  transition: var(--transition); outline: none; color: var(--text); font-size: 15px;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,97,0.15);
}
.form-textarea { resize: vertical; min-height: 90px; }
.form-error { color: var(--danger); font-size: 12px; margin-top: 4px; }

/* ===== Image Uploader ===== */
.img-uploader {
  display: flex; gap: 12px; align-items: center;
  padding: 12px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  background: var(--bg-soft); transition: var(--transition);
}
.img-uploader:hover { border-color: var(--gold); }
.img-preview {
  width: 70px; height: 70px; border-radius: 12px; flex-shrink: 0;
  background-size: cover; background-position: center;
  background-color: var(--black-soft); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 22px;
}
.img-preview.circle { border-radius: 50%; }
.img-uploader-actions { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.img-uploader-actions .btn { padding: 9px 14px; font-size: 12px; }
.img-hint { font-size: 11px; color: var(--text-muted); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
  z-index: 500; display: flex; align-items: center; justify-content: center;
  padding: 20px; animation: fadeIn 0.25s ease;
}
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; padding: 24px; max-width: 460px; width: 100%;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
  animation: modalIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-header h3 { font-size: 20px; }
.modal-close { font-size: 26px; color: var(--text-muted); line-height: 1; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-soft); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0; color: var(--text-muted); transition: var(--transition); font-size: 10px;
}
.nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav-item.active { color: var(--gold); }
.nav-item.active svg { stroke: var(--gold); }

@media (min-width: 900px) {
  body { flex-direction: row; }
  #app { padding-bottom: 0; padding-left: 240px; }
  .bottom-nav {
    top: 0; right: auto; width: 220px; flex-direction: column;
    justify-content: flex-start; padding: 20px 12px; gap: 6px;
    border-top: none; border-right: 1px solid var(--border);
  }
  .nav-item {
    flex-direction: row; justify-content: flex-start; gap: 14px;
    padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
  }
  .nav-item:hover { background: var(--bg-card); }
  .nav-item.active { background: rgba(201,169,97,0.1); }
  .topbar { position: fixed; top: 0; left: 220px; right: 0; }
  main { padding-top: 90px; }
}

.badge {
  display: inline-block; padding: 4px 10px; border-radius: 50px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
}
.badge-gold { background: rgba(201,169,97,0.15); color: var(--gold); border: 1px solid rgba(201,169,97,0.3); }
.badge-success { background: rgba(39,174,96,0.15); color: var(--success); }
.badge-warning { background: rgba(243,156,18,0.15); color: var(--warning); }
.badge-danger { background: rgba(231,76,60,0.15); color: var(--danger); }
.badge-info { background: rgba(52,152,219,0.15); color: var(--info); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 13px; font-weight: 500;
  background: var(--bg-soft); border: 1.5px solid transparent; transition: var(--transition);
}
.cal-day.empty { background: transparent; }
.cal-day.available:hover { border-color: var(--gold); }
.cal-day.selected { background: var(--gold); color: var(--black); font-weight: 700; }
.cal-day.disabled { color: var(--gray-600); cursor: not-allowed; opacity: 0.4; }
.cal-day.today { border-color: var(--gold); }
.cal-day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); margin-top: 2px; }

.slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
@media(min-width: 600px){ .slots-grid { grid-template-columns: repeat(5, 1fr);} }
.slot {
  padding: 12px 6px; text-align: center; border-radius: 10px; font-size: 13px; font-weight: 600;
  background: var(--bg-soft); border: 1.5px solid var(--border); transition: var(--transition);
}
.slot:hover:not(.taken) { border-color: var(--gold); }
.slot.selected { background: var(--gold); color: var(--black); border-color: var(--gold); }
.slot.taken { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }

.steps { display: flex; justify-content: space-between; margin-bottom: 22px; }
.step { flex: 1; text-align: center; position: relative; }
.step::before {
  content: ''; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--border);
}
.step:last-child::before { display: none; }
.step-dot {
  width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 6px;
  background: var(--bg-card); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  position: relative; z-index: 1; transition: var(--transition);
}
.step.done .step-dot, .step.current .step-dot {
  background: var(--gold); color: var(--black); border-color: var(--gold);
}
.step.done::before { background: var(--gold); }
.step-label { font-size: 10px; color: var(--text-muted); }
.step.current .step-label { color: var(--gold); font-weight: 600; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media(min-width: 700px){ .stat-grid { grid-template-columns: repeat(4, 1fr);} }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; margin-top: 6px; color: var(--gold); }
.stat-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(201,169,97,0.15); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }

.admin-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
.admin-tab {
  padding: 9px 16px; border-radius: 50px; white-space: nowrap;
  background: var(--bg-card); border: 1px solid var(--border); font-size: 13px; font-weight: 500;
  transition: var(--transition);
}
.admin-tab.active { background: var(--gold); color: var(--black); border-color: var(--gold); }

.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); }
th { background: var(--bg-soft); font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(201,169,97,0.04); }

#toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9998;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.toast {
  padding: 14px 20px; border-radius: 12px; background: var(--bg-card);
  border-left: 4px solid var(--gold); color: var(--text); font-size: 14px;
  box-shadow: var(--shadow); animation: toastIn 0.35s ease; max-width: 320px;
  pointer-events: auto;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-soft) 50%, var(--bg-card) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;
}
@keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

.row { display: flex; gap: 10px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 14px; } .mt-4 { margin-top: 20px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 14px; } .mb-4 { margin-bottom: 20px; }
.text-center { text-align: center; }
.gold { color: var(--gold); }
.flex-1 { flex: 1; }
.stars { display: flex; gap: 2px; color: var(--gold); font-size: 16px; }
.divider { height: 1px; background: var(--border); margin: 18px 0; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state svg { width: 50px; height: 50px; stroke: var(--gold); fill: none; stroke-width: 1.5; opacity: 0.5; margin-bottom: 12px; }

.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media(min-width: 700px){ .gallery-grid { grid-template-columns: repeat(4, 1fr);} }
.gallery-item {
  aspect-ratio: 1; border-radius: 12px; background-size: cover; background-position: center;
  cursor: pointer; transition: var(--transition); border: 1px solid var(--border);
}
.gallery-item:hover { transform: scale(1.03); border-color: var(--gold); }

.progress-bar { height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-light), var(--gold)); transition: width 0.5s ease; }
</style>
</head>

/* ================== FILE / IMAGE PICKER ================== */
function pickImage(targetId, previewId, isCircle) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!f.type.startsWith('image/')) { toast('Selecione um arquivo de imagem.', 'error'); return; }
    if (f.size > 3 * 1024 * 1024) {
      toast('Imagem muito grande (máx 3MB). Tente outra.', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      const el = document.getElementById(targetId);
      if (el) el.value = dataUrl;
      const p = previewId ? document.getElementById(previewId) : null;
      if (p) {
        p.style.backgroundImage = `url('${dataUrl}')`;
        p.style.backgroundSize = 'cover';
        p.style.backgroundPosition = 'center';
        p.innerHTML = '';
      }
      toast('Imagem carregada!');
    };
    reader.onerror = () => toast('Falha ao ler imagem.', 'error');
    reader.readAsDataURL(f);
  };
  input.click();
}

function removeImage(targetId, previewId, isCircle) {
  const el = document.getElementById(targetId);
  if (el) el.value = '';
  const p = previewId ? document.getElementById(previewId) : null;
  if (p) {
    p.style.backgroundImage = 'none';
    p.innerHTML = isCircle ? '📷' : '🖼️';
  }
  toast('Imagem removida.', 'info');
}

  const previewStyle = currentSrc ? `background-image:url('${esc(currentSrc)}')` : '';
  const iconContent = currentSrc ? '' : (circle ? '📷' : '🖼️');
  return `
    <div class="form-group">
      <label class="form-label">${esc(inputName||'Imagem')}</label>
      <div class="img-uploader">
        <div class="img-preview ${circle?'circle':''}" id="${previewId}" style="${previewStyle}">${iconContent}</div>
        <div class="img-uploader-actions">
          <button type="button" class="btn btn-primary btn-sm" onclick="pickImage('${inputId}','${previewId}',${circle?true:false})">📁 Escolher da galeria</button>

function initCarousel() {
  const slides = document.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('.carousel-dots span');
  if (!slides.length) return;
  let idx = 0;
  clearInterval(window._carTimer);
  window._carTimer = setInterval(() => {
    slides[idx].classList.remove('active'); dots[idx]?.classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active'); dots[idx]?.classList.add('active');
  }, 4500);
}

let scheduleState = { step: 1, service: null, professional: null, date: todayISO(), time: null, payment: 'Pix' };

function startSchedule(serviceId) {

function renderSchedule(main) {

              <div class="gold" style="font-weight:600;margin-top:4px;">${fmtMoney(x.promo>0?x.promo:x.price)}</div>
            </div>
          </div>
        </div>
      `).join('')}
    `;

    content.innerHTML = `
      <p class="muted mb-3">Escolha o profissional:</p>
      ${pros.map(p => `
        <div class="card" style="cursor:pointer;${st.professional===p.id?'border-color:var(--gold);':''}" onclick="selectProfessional('${p.id}')">
          <div class="card-row">
            <div class="avatar" style="background-image:url('${p.photo}')"></div>
            <div class="flex-1">
              <div style="font-weight:600;">${esc(p.name)}</div>
              <div class="muted" style="font-size:12px;">${esc(p.role)}</div>
              <div class="muted mt-2" style="font-size:12px;">${esc(p.specialties)}</div>
            </div>
          </div>
        </div>
      `).join('') || '<div class="empty-state"><p>Nenhum profissional disponível.</p></div>'}
      <button class="btn btn-ghost btn-block mt-3" onclick="schedulePrev()">← Voltar</button>
    `;
  } else if (step === 3) {
    content.innerHTML = `
      <p class="muted mb-3">Escolha a data:</p>
      <div id="calWrap"></div>
      <button class="btn btn-ghost btn-block mt-3" onclick="schedulePrev()">← Voltar</button>
    `;

  } else if (step === 4) {

      <div class="slots-grid" id="slotsWrap"></div>

        <button class="btn btn-ghost" onclick="schedulePrev()">← Voltar</button>
      </div>
    `;
    renderSlots();

    content.innerHTML = `
      <p class="muted mb-3">Confirme os dados do seu agendamento:</p>
      <div class="card">
        <div class="row-between mb-2"><span class="muted">Serviço</span><span style="font-weight:600;">${esc(s.name)}</span></div>
        <div class="row-between mb-2"><span class="muted">Profissional</span><span>${esc(p.name)}</span></div>
        <div class="row-between mb-2"><span class="muted">Data</span><span>${fmtDate(st.date)}</span></div>
        <div class="row-between mb-2"><span class="muted">Horário</span><span>${st.time}</span></div>

      <button class="btn btn-primary btn-block mt-3" onclick="confirmSchedule()">Confirmar agendamento</button>

function selectService(id) { scheduleState.service = id; scheduleState.step = 2; renderSchedule(document.getElementById('mainContent')); }
function selectProfessional(id) { scheduleState.professional = id; scheduleState.step = 3; renderSchedule(document.getElementById('mainContent')); }
function schedulePrev() { scheduleState.step = Math.max(1, scheduleState.step - 1); renderSchedule(document.getElementById('mainContent')); }

function renderCalendar() {
  const wrap = document.getElementById('calWrap');
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month+1, 0).getDate();
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let html = `<div class="card"><div style="text-align:center;font-weight:600;margin-bottom:12px;">${monthNames[month]} ${year}</div><div class="cal-grid">`;
  ['D','S','T','Q','Q','S','S'].forEach(d => html += `<div style="text-align:center;font-size:11px;color:var(--text-muted);">${d}</div>`);
  for (let i=0; i<first; i++) html += `<div class="cal-day empty"></div>`;
  for (let d=1; d<=days; d++) {
    const dateObj = new Date(year, month, d);
    const iso = dateObj.toISOString().slice(0,10);
    const dow = dateObj.getDay();
    const isPast = dateObj < new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const isSunday = dow === 0;
    const disabled = isPast || isSunday;
    const isSelected = iso === scheduleState.date;
    html += `<button class="cal-day ${disabled?'disabled':'available'} ${isSelected?'selected':''} ${iso===todayISO()?'today':''}" ${disabled?'disabled':''} onclick="pickDate('${iso}')">${d}${!disabled?'<span class="dot"></span>':''}</button>`;
  }
  html += `</div></div>`;
  wrap.innerHTML = html;
}
function pickDate(iso) { scheduleState.date = iso; scheduleState.step = 4; renderSchedule(document.getElementById('mainContent')); }

function renderSlots() {
  const wrap = document.getElementById('slotsWrap');
  const s = DB.data.services.find(x=>x.id===scheduleState.service);
  const cfg = DB.data.config.hours;
  const dur = s.duration;
  const slots = [];
  const open = cfg.openHour*60, close = cfg.closeHour*60;
  for (let t=open; t + dur <= close; t += 30) {
    slots.push(minToTime(t));
  }
  const taken = DB.data.appointments.filter(a =>
    a.date === scheduleState.date &&
    a.professional === scheduleState.professional &&
    ['confirmed','pending','rescheduled'].includes(a.status)
  );
  wrap.innerHTML = slots.map(t => {
    const startMin = timeToMin(t);
    const endMin = startMin + dur;
    const conflict = taken.some(a => {
      const aS = timeToMin(a.time);
      const aE = aS + (a.duration||60);
      return startMin < aE && endMin > aS;
    });
    const isSel = scheduleState.time === t;
    return `<button class="slot ${conflict?'taken':''} ${isSel?'selected':''}" ${conflict?'disabled':''} onclick="pickTime('${t}')">${t}</button>`;
  }).join('');
}
function pickTime(t) { scheduleState.time = t; scheduleState.step = 5; renderSchedule(document.getElementById('mainContent')); }

function confirmSchedule() {
  if (!State.user) { toast('Faça login para agendar.', 'info'); Router.go('login'); return; }
  const st = scheduleState;
  const s = DB.data.services.find(x=>x.id===st.service);
  const p = DB.data.professionals.find(x=>x.id===st.professional);
  const payMethod = document.getElementById('payMethod').value;
  const appt = {
    id: uid(),
    userId: State.user.id,
    userName: State.user.name,
    serviceId: s.id,
    serviceName: s.name,
    professionalId: p.id,
    professionalName: p.name,
    date: st.date,
    time: st.time,
    duration: s.duration,
    price: s.promo > 0 ? s.promo : s.price,
    payment: payMethod,
    status: 'confirmed',
    createdAt: Date.now(),
  };
  DB.data.appointments.unshift(appt);
  DB.data.notifications.unshift({
    id: uid(), userId: State.user.id, title: 'Agendamento confirmado',
    message: `Seu horário para ${s.name} em ${fmtDate(st.date)} às ${st.time} foi confirmado.`,
    type: 'confirmacao', read: false, createdAt: Date.now(),
  });
  DB.data.payments.unshift({
    id: uid(), appointmentId: appt.id, userId: State.user.id, userName: State.user.name,
    amount: appt.price, method: payMethod, status: 'pendente', createdAt: Date.now(),
  });
  DB.save();
  scheduleState = { step: 1, service: null, professional: null, date: todayISO(), time: null, payment: 'Pix' };
  openModal(`
    <div class="modal-header"><h3>Agendamento Confirmado ✨</h3><button class="modal-close" onclick="closeModal();Router.go('appointments')">×</button></div>
    <div style="text-align:center;padding:12px 0;">
      <div style="width:70px;height:70px;border-radius:50%;background:rgba(201,169,97,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px;">✓</div>

      <p class="muted mt-2" style="font-size:13px;">Você receberá lembretes automáticos.</p>
    </div>
    <button class="btn btn-primary btn-block" onclick="closeModal();Router.go('appointments')">Ver meus agendamentos</button>
  `);

function renderAppointments(main) {

  const upcoming = list.filter(a => new Date(a.date+'T'+a.time) >= new Date() && ['confirmed','pending','rescheduled'].includes(a.status));
  const past = list.filter(a => !upcoming.includes(a));

  main.innerHTML = `
    <div class="page">
      <h2 class="section-title">Meus Agendamentos</h2>
      <p class="eyebrow">Próximos</p>
      ${upcoming.length ? upcoming.map(a => appointmentCard(a, true)).join('') : '<div class="card"><p class="muted">Nenhum agendamento próximo. <a onclick="Router.go(\'schedule\')">Agendar agora</a></p></div>'}
      <p class="eyebrow mt-4">Histórico</p>

function appointmentCard(a, upcoming) {
  const statusMap = {
    'confirmed': { label: 'Confirmado', cls: 'badge-success' },
    'pending': { label: 'Pendente', cls: 'badge-warning' },
    'cancelled': { label: 'Cancelado', cls: 'badge-danger' },
    'rescheduled': { label: 'Reagendado', cls: 'badge-info' },
    'completed': { label: 'Concluído', cls: 'badge-gold' },
  };
  const st = statusMap[a.status] || statusMap.confirmed;
  return `
    <div class="card">
      <div class="row-between mb-2">
        <div style="font-weight:600;">${esc(a.serviceName)}</div>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>
      <div class="muted" style="font-size:13px;">${fmtDate(a.date)} às ${a.time} • ${esc(a.professionalName)}</div>
      <div class="gold mt-2" style="font-weight:700;">${fmtMoney(a.price)}</div>
      ${upcoming ? `
        <div class="row mt-3">
          <button class="btn btn-outline btn-sm" onclick="rescheduleAppt('${a.id}')">Reagendar</button>
          <button class="btn btn-danger btn-sm" onclick="cancelAppt('${a.id}')">Cancelar</button>
        </div>
      ` : (a.status === 'completed' && !DB.data.reviews.find(r=>r.appointmentId===a.id) ? `
        <button class="btn btn-primary btn-sm mt-3" onclick="openReview('${a.id}')">⭐ Avaliar</button>
      ` : '')}
    </div>
  `;
}

function cancelAppt(id) {
  if (!confirm('Deseja realmente cancelar este agendamento?')) return;
  const a = DB.data.appointments.find(x => x.id === id);
  if (!a) return;
  a.status = 'cancelled';
  DB.data.notifications.unshift({ id: uid(), userId: a.userId, title: 'Agendamento cancelado', message: `Seu agendamento para ${a.serviceName} em ${fmtDate(a.date)} foi cancelado.`, type: 'cancelamento', read: false, createdAt: Date.now() });
  DB.save();
  toast('Agendamento cancelado.');
  Router.go('appointments');
}

function rescheduleAppt(id) {
  const a = DB.data.appointments.find(x => x.id === id);
  if (!a) return;
  scheduleState = { step: 4, service: a.serviceId, professional: a.professionalId, date: todayISO(), time: null, payment: a.payment };
  a.status = 'cancelled';
  DB.save();
  toast('Escolha nova data e horário.', 'info');

function topServices() {
  const counts = {};
  DB.data.appointments.forEach(a => { counts[a.serviceName] = (counts[a.serviceName]||0) + 1; });
  return Object.entries(counts).map(([name,count]) => ({name,count})).sort((a,b)=>b.count-a.count).slice(0,5);
}

/* ================== MODAL ================== */
function openModal(html) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(overlay);
}
function closeModal() {
  const el = document.getElementById('modalOverlay');
  if (el) el.remove();
}

function processReminders() {
  const now = Date.now();
  DB.data.appointments.forEach(a => {
    if (a.status !== 'confirmed') return;
    const apptTime = new Date(a.date + 'T' + a.time).getTime();
    const diff = apptTime - now;
    const flagKey = `rem_${a.id}`;
    const flag = DB.data._flags = DB.data._flags || {};
    if (diff > 0 && diff <= 24*3600*1000 && !flag[flagKey+'_24h'] && DB.data.config.reminders.h24) {
      flag[flagKey+'_24h'] = true;
      DB.data.notifications.unshift({ id: uid(), userId: a.userId, title: 'Lembrete: amanhã é seu dia!', message: DB.data.config.reminders.template24.replace('[NOME]', a.userName.split(' ')[0]).replace('[HORARIO]', a.time), type: 'lembrete', read: false, createdAt: Date.now() });
    }
    if (diff > 0 && diff <= 2*3600*1000 && !flag[flagKey+'_2h'] && DB.data.config.reminders.h2) {
      flag[flagKey+'_2h'] = true;
      DB.data.notifications.unshift({ id: uid(), userId: a.userId, title: 'Faltam 2 horas!', message: DB.data.config.reminders.template2.replace('[NOME]', a.userName.split(' ')[0]).replace('[HORARIO]', a.time), type: 'lembrete', read: false, createdAt: Date.now() });
    }
  });
  DB.save();
}

/* ================== BOOT ================== */
window.addEventListener('DOMContentLoaded', () => {
  DB.init();
  State.load();
  applyTheme();
  setTimeout(() => {
    const splash = document.getElementById('splash');
    splash.style.opacity = '0';
    setTimeout(() => splash.remove(), 600);
    document.getElementById('app').classList.add('active');
    Router.go(State.user ? (State.user.type === 'admin' ? 'admin' : 'home') : 'home');
    processReminders();
  }, 1500);
});
</script>
